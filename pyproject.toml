[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nightingale"
version = "0.1.0"
description = "A Python package for prioritizing GitHub issues using the Command pattern"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Kristian Garza", email = "kj.garza@gmail.com"}
]
keywords = ["github", "issues", "prioritization", "bug-tracking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests",
    "click",
]

[project.urls]
Homepage = "https://github.com/kjgarza/nightingale"
Repository = "https://github.com/kjgarza/nightingale"
Issues = "https://github.com/kjgarza/nightingale/issues"

[project.scripts]
nightingale = "nightingale.cli:main"

[project.optional-dependencies]
dev = [
    "flake8",
    "pytest",
]

[tool.setuptools]
packages = ["nightingale"]
